name: Release QGIS Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check metadata
        run: |
          echo "=== metadata.txt ==="
          cat metadata.txt
          echo "===================="

          test -f metadata.txt

      - name: Create plugin ZIP
        run: |
          PLUGIN_NAME="${{ github.event.repository.name }}"
          VERSION="${{ github.ref_name }}"

          echo "Plugin name : $PLUGIN_NAME"
          echo "Version     : $VERSION"

          mkdir -p "package/$PLUGIN_NAME"

          # Gitの現在のタグから配布用ファイルを展開
          git archive HEAD | tar -x -C "package/$PLUGIN_NAME"

          # 配布ZIPに含めないファイル
          rm -f "package/$PLUGIN_NAME/sources.json"

          # ZIP作成
          cd package
          zip -r "../${PLUGIN_NAME}-${VERSION}.zip" "$PLUGIN_NAME"

      - name: Verify ZIP
        run: |
          ZIP_FILE="${{ github.event.repository.name }}-${{ github.ref_name }}.zip"
          PLUGIN_NAME="${{ github.event.repository.name }}"

          echo "=== ZIP contents ==="
          unzip -l "$ZIP_FILE"
          echo "===================="

          # sources.jsonが入っていないことを確認
          if unzip -l "$ZIP_FILE" | grep -q "sources.json"; then
            echo "ERROR: sources.json is included in the ZIP!"
            exit 1
          fi

          # 最上位フォルダが正しいことを確認
          if ! unzip -l "$ZIP_FILE" | grep -q "${PLUGIN_NAME}/__init__.py"; then
            echo "ERROR: Plugin root folder is incorrect!"
            exit 1
          fi

          echo "ZIP verification passed."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ github.event.repository.name }}-${{ github.ref_name }}.zip